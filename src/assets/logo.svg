<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50" fill="none">
  <defs>
    <!-- Video theme gradient: Violet to Purple -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- AI Badge Accent Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Icon Badge -->
  <g transform="translate(4, 5)">
    <rect width="40" height="40" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.3" />
    <rect width="40" height="40" rx="10" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="1.5" />
    
    <!-- Stylized "A" + Sparkle / Play Shape -->
    <path d="M20 10 L28 29 L23.5 29 L21.8 24.5 L18.2 24.5 L16.5 29 L12 29 Z M20 15 L18.8 21.5 L21.2 21.5 Z" fill="#ffffff" />
    <circle cx="28" cy="12" r="2.5" fill="#38bdf8" />
    <path d="M28 8 L29 12 L33 12 L29.5 14 L31 18 L28 15 L25 18 L26.5 14 L23 12 L27 12 Z" fill="#a855f7" transform="scale(0.35) translate(46, 12)" />
  </g>

  <!-- Brand Typography -->
  <!-- "AadilGroup" Text in White -->
  <text x="56" y="32" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.3">
    AadilGroup
  </text>

  <!-- "AI" Pill Badge (Violet/Pink gradient background) -->
  <g transform="translate(182, 13)">
    <rect width="36" height="22" rx="6" fill="url(#aiGrad)" />
    <text x="18" y="15.5" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      AI
    </text>
  </g>
</svg>